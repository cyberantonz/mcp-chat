---
# Dependabot bumps pins in requirements*.in / *.txt but regenerates lockfiles
# with pip logic that does not match our `uv pip compile --universal
# --generate-hashes` format, breaking hash-verified installs and the
# requirements-txt-fixer hook. This workflow recompiles the lockfiles with uv
# on every dependabot PR and pushes the corrected result to the PR branch.
name: Recompile lockfiles on dependabot PRs

on: # yamllint disable-line rule:truthy
  pull_request: null

permissions: {}

jobs:
  recompile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Recompile lockfiles with uv
        run: |
          uv pip compile --universal --generate-hashes requirements.in -o requirements.txt
          uv pip compile --universal --generate-hashes requirements-dev.in -o requirements-dev.txt
      - name: Push corrected lockfiles
        run: |
          if git diff --quiet; then
            echo "lockfiles already match uv output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt requirements-dev.txt
          # [dependabot skip] lets dependabot keep managing (rebasing) this PR
          git commit -m "Recompile lockfiles with uv [dependabot skip]"
          git push
