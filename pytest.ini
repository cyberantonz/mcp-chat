[pytest]
testpaths = tests
required_plugins = pytest-env pytest-asyncio
asyncio_mode = auto
# one event loop per (xdist worker) session: the app's engine/connection pool
# is a process-level singleton and must stay on a single loop
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
env =
    D:DATABASE_URL=postgresql+asyncpg://agents:agents@localhost:5432/agents
    D:DATABASE_POOL_SIZE=10
    D:DATABASE_POOL_MAX_OVERFLOW=20
    D:HOST=127.0.0.1
    D:PORT=8000
