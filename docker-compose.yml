---
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://agents:agents@postgres:5432/agents
      DATABASE_POOL_SIZE: 10
      DATABASE_POOL_MAX_OVERFLOW: 20
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
      RATE_LIMIT_PER_IP: 30
      RATE_LIMIT_PER_AGENT: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "8000:8000"

volumes:
  pgdata:
